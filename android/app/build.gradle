plugins { id 'com.android.application' }

def mobileAssets = rootProject.file('assets')
def decodedAssets = layout.buildDirectory.dir('generated/metis/assets')
def decodedResources = layout.buildDirectory.dir('generated/metis/res')

def decodeMobileAssets = tasks.register('decodeMobileAssets') {
    inputs.files(fileTree(mobileAssets) { include '*.b64' })
    outputs.dir(decodedAssets)
    outputs.dir(decodedResources)
    doLast {
        fileTree(mobileAssets).matching { include '*.b64' }.each { encoded ->
            def name = encoded.name.substring(0, encoded.name.length() - 4)
            def directory = name.endsWith('.ttf')
                ? new File(decodedAssets.get().asFile, 'fonts')
                : new File(decodedResources.get().asFile, 'drawable-nodpi')
            directory.mkdirs()
            new File(directory, name).bytes = Base64.mimeDecoder.decode(encoded.text)
        }
    }
}

android {
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.metisai.mobile'
    compileSdk 35
    defaultConfig {
        applicationId 'com.metisai.mobile'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4.0'
    }
    sourceSets {
        main.assets.srcDir(decodedAssets)
        main.res.srcDir(decodedResources)
    }
}

tasks.named('preBuild').configure { dependsOn(decodeMobileAssets) }

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'net.objecthunter:exp4j:0.4.8'
    implementation 'io.github.webrtc-sdk:android:125.6422.05'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
}
